{% extends "base.html" %}
{% block title %}Entry{% endblock %}
{% block content %}

{% if entry %}
    <article>
        <p>{{ entry.content }}</p>
        <small>Created on: {{ entry.date_created }}</small>
    </article>
    
    {% if session.username == author %}
        <a href="{{ url_for('edit_get', id=request.args.get('id')) }}">
            <button>Edit Entry</button>
        </a>
    {% endif %}
{% else %}
    <p>Entry not found.</p>
{% endif %}

{% endblock %}
