{% extends "base.html" %}
{% block title %}Edit Entry{% endblock %}
{% block content %}

<h2>Edit Entry</h2>
{% if entry %}
    <form method="POST" action="{{ url_for('edit_post', id=entry.id) }}">
        {% for field in entry.content %}
        <textarea name="{{ field['type'] }}" rows="10" cols="50" required>{{ field["content"] }}</textarea><br>
        {% endfor %}
        <input type="submit" value="Save Changes">
    </form>
{% else %}
    <p>Entry not found.</p>
{% endif %}

{% endblock %}
